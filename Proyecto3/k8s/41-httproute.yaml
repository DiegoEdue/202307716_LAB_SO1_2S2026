# Ruta del flujo estandar (gRPC). La ruta /dapr-202307716 se agrega si se hace el extra
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: mumnk8s
spec:
  parentRefs:
    - name: api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grpc-202307716
      backendRefs:
        - name: api-rust-service
          port: 80
