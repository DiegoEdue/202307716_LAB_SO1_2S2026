# Deployment 1: API REST + cliente gRPC (2 containers, misma imagen, distinto MODE)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-deploy
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      imagePullSecrets:
        - name: zot-creds
      containers:
        - name: api-rest
          image: ZOT_HOST/go-api:v1
          env:
            - name: MODE
              value: rest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
        - name: grpc-client
          image: ZOT_HOST/go-api:v1
          env:
            - name: MODE
              value: client
            - name: GRPC_SERVER_ADDR
              value: go-server-svc:50051
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: go-api-svc
  namespace: mumnk8s
spec:
  selector:
    app: go-api
  ports:
    - port: 8080
      targetPort: 8080
