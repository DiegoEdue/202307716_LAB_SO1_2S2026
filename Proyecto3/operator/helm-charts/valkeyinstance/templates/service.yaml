# Apunta solo al primario (pod 0): el consumer y Grafana siempre hablan con él
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: valkey
spec:
  selector:
    app: valkey
    statefulset.kubernetes.io/pod-name: {{ .Release.Name }}-0
  ports:
    - name: valkey
      port: {{ .Values.service.port }}
      targetPort: valkey
