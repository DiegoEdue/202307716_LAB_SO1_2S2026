apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-provisioning
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: {{ .Values.datasource.name }}
        uid: valkey
        type: redis-datasource
        access: proxy
        url: {{ .Values.datasource.url | quote }}
        isDefault: true
        editable: false
        jsonData:
          client: standalone
          poolSize: 5
          timeout: 10
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: mumn
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
