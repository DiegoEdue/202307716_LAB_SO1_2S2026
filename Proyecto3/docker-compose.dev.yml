services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: mumn
      RABBITMQ_DEFAULT_PASS: mumn123
    ports:
      - "5672:5672"
      - "15672:15672"

  go-server-svc:
    build: ./go-grpc-server
    environment:
      MODE: server

  go-writer:
    build: ./go-grpc-server
    network_mode: "service:go-server-svc"
    depends_on: [rabbitmq]
    restart: unless-stopped
    environment:
      MODE: writer
      RABBITMQ_URL: amqp://mumn:mumn123@rabbitmq:5672/

  go-rest:
    build: ./go-api
    environment:
      MODE: rest

  go-client:
    build: ./go-api
    network_mode: "service:go-rest"
    depends_on: [go-rest]
    environment:
      MODE: client
      GRPC_SERVER_ADDR: go-server-svc:50051

  api-rust:
    build: ./api-rust
    ports: ["8080:8080"]
    depends_on: [go-rest]
    environment:
      GO_API_URL: http://go-rest:8080/report
      CARNET: "202307716"
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
  go-consumer:
    build: ./go-consumer
    depends_on: [rabbitmq, valkey]
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://mumn:mumn123@rabbitmq:5672/
      QUEUE: reports
      VALKEY_ADDR: valkey:6379
      ASSIGNED_COUNTRY: esp